# SPDX-License-Identifier: GPL-3.0-or-later
# Every commit to main builds the DM-32UV firmware image without the AMBE codec, as the web flasher installs it, and
# publishes it as a new release: v<YYYY.MM.DD>-<short commit>, with rfoundry-dm32-<version>.bin, its
# rfoundry-release/1 manifest and SHA256SUMS. The web flasher (dm32-web-cps-flasher, its Sync firmware workflow) picks
# up the latest release and installs it from then on.
# A manual run (Actions > Firmware > Run workflow) does the same, with an optional version name of your own.
#
# Never fetches the stock firmware or any AMBE material: the toolchain bootstrap fetches only the compiler sources
# (SOURCES_ONLY), the build (tools/build_current.py) uses no stock material, and tools/release.py refuses an image that
# reaches the codec.
name: Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (default: YYYY.MM.DD-<short commit>); the release is v<version>"
        required: false
      title:
        description: "Release title (default: NXDN-P25-DM32 <version>)"
        required: false

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bison flex texinfo zlib1g-dev \
            libgmp-dev libmpfr-dev libmpc-dev clang python3 nlohmann-json3-dev

      # The C-SKY compiler and newlib are built once and kept between runs
      - name: Restore C-SKY toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: csky-toolchain-${{ runner.os }}-${{ hashFiles('tools/bootstrap_toolchain.sh', 'tools/bootstrap_newlib.sh', 'sources.lock.json') }}

      - name: Build C-SKY toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        env:
          SOURCES_ONLY: research/toolchain
          JOBS: 4
        run: |
          sh tools/bootstrap_toolchain.sh
          sh tools/bootstrap_newlib.sh

      # RadioFoundry at its pinned commit plus integration/current/base.patch (tools/build_current.py)
      - name: Build firmware
        run: python3 tools/build_current.py --jobs 4

      - name: Check digital voice and the MMDVM modem interface
        run: |
          set -eu
          T=build/current/tests/host
          tests="sigToneTest ambeVoiceTest radioFeaturesTest radioCoreTestNxdn radioListenBandsTest aprsTest aprsRadioTest aprsRadioMdcTest rda5807mTest voiceCipherTest dmrAesTest dmrPrivacyTest dmrCallTest dmrCallTestAes hrc7000DmrTest hrc7000AirTest p25Test p25EngineTest p25EngineTestAes p25VoiceTest
            dmrFecTest dmrRxChainTest
            nxdnTest nxdnEngineTest nxdnEngineTestAes aesTest ysfTest ysfEngineTest radioCoreTestYsf
            radioCoreTestP25Nxdn radioCoreTestAirInterop fd6818Test m17Test m17VoiceTest radioCoreTestM17 radioCoreTestDstar
            mmdvmTest codeplugEditTest codeplugEditTestDstar codeplugTagTest settingsTest uiFlowTest uiFlowTestReplay uiFlowTestDstar"
          make -C "$T" -j4 $tests
          for t in $tests; do
            (cd "$T" && ./"$t")
          done

      - name: Check Monitor Scan and Morse with the optional modules enabled
        run: |
          set -eu
          T=build/current/tests/host
          tests="radioCoreTestMonitor radioCoreTestCw radioCoreTestMonitorCw uiSignalToolsTest"
          make -C "$T" -j4 $tests
          for t in $tests; do
            (cd "$T" && ./"$t")
          done
          digital="radioCoreTestDstar radioCoreTestYsf radioCoreTestP25Nxdn radioCoreTestM17"
          make -B -C "$T" -j4 CC="cc -DCONFIG_MONITOR_SCAN=1" $digital
          for t in $digital; do
            (cd "$T" && ./"$t")
          done

      - name: Decode digital TX with MMDVM
        run: python3 tools/test_mmdvm_interop.py

      - name: Check D-STAR GMSK receive acquisition
        run: |
          set -eu
          cc -std=c11 -O2 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -Isrc/dstar -Ibuild/current/core -Ibuild/current/hal \
            src/dstar/dv_frame.c src/dstar/dv_stream.c src/dstar/dv_engine.c \
            build/current/core/air/air_softmodem.c tests/test_dstar_gmsk.c -o "$RUNNER_TEMP/dstar-gmsk"
          "$RUNNER_TEMP/dstar-gmsk"

      - name: Check channel modes, privacy and boot images in the CPS
        run: |
          set -eu
          export RFOUNDRY_SITE_FIXTURES="$RUNNER_TEMP/cps-fixtures"
          mkdir -p "$RFOUNDRY_SITE_FIXTURES"
          make -C build/current/tests/host cpsSim gfxSplashTest
          (cd build/current/tests/host && ./gfxSplashTest)
          build/current/tests/host/cpsSim --populate --dump "$RFOUNDRY_SITE_FIXTURES/codeplug_sim.bin" </dev/null
          node --test build/current/site/tests/{modes,csv,channel-aes,bootimage}.test.mjs

      - name: Check the P25 and NXDN bench tools
        run: |
          python3 tools/bench/p25tool.py selftest
          python3 tools/bench/nxdntool.py selftest
        working-directory: build/current

      - name: Package the image
        id: package
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eu
          VERSION="${INPUT_VERSION:-$(date -u +%Y.%m.%d)-${GITHUB_SHA::8}}"
          TREE=build/current
          # The manifest's git and git_time are this repository's commit: release.py reads them from the tree's objects
          git -C "$TREE" fetch -q --depth=1 "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          mkdir -p dist
          # release.py asks make print-config for the manifest: pass the same optional features as build_current.py,
          # otherwise the image contains M17/MDC1200 but the flasher's manifest incorrectly lists them as off
          (cd "$TREE" && MAKEFLAGS="CROSS=$GITHUB_WORKSPACE/toolchain/bin/csky-elf- CONFIG_M17=y CONFIG_MDC1200=y" \
            python3 tools/release.py --board dm32 --version "$VERSION" --git "$GITHUB_SHA" \
            --bin build/dm32/rfoundry_dm32.bin --out "$GITHUB_WORKSPACE/dist")
          python3 - "$GITHUB_WORKSPACE/dist/rfoundry-dm32-$VERSION.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              manifest = json.load(f)
          enabled = set(manifest["features"].split(","))
          disabled = set(manifest["off"].split(","))
          required = {"DMR", "P25", "NXDN", "YSF", "M17", "DSTAR", "MDC1200"}
          missing = (required - enabled) | (required & disabled)
          if missing:
              raise SystemExit(f"full release manifest missing features: {', '.join(sorted(missing))}")
          if "AIR_RAW" in enabled or "AIR_RAW" not in disabled:
              raise SystemExit("release manifest unexpectedly enables AIR_RAW")
          experimental = {"MONITOR_SCAN", "CW"}
          if experimental & enabled or not experimental <= disabled:
              raise SystemExit("full release must leave Monitor Scan and CW off by default")
          if "BCAST_FM" not in enabled or "BCAST_FM" in disabled:
              raise SystemExit("release manifest is missing broadcast FM")
          print("Full release manifest includes all tested digital voice modes")
          PY
          for PRESET in multimode dmr-fm; do
            (
              cd "$TREE"
              export MAKEFLAGS="CROSS=$GITHUB_WORKSPACE/toolchain/bin/csky-elf- CONFIG_MDC1200=y"
              make -j4 BOARD=dm32 VARIANT="$PRESET" RFOUNDRY_PRESET="$PRESET" GITVERSION="${GITHUB_SHA::8}" GITDIRTY= \
                RFOUNDRY_GIT_TIME="$(git show -s --format=%ct "$GITHUB_SHA")" all stack-check
              python3 tools/release.py --board dm32 --variant "$PRESET" --version "$VERSION" \
                --git "$GITHUB_SHA" --out "$GITHUB_WORKSPACE/dist"
            )
          done
          MODE_ARGS=(--experimental)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            MODE_ARGS=(--only modes-p25 --only modes-p25-m17-dstar --only modes-p25-nxdn-m17-dstar --only modes-p25-ysf-m17-dstar
              --only modes-monitor-scan --only modes-p25-nxdn-ysf-cw --only modes-p25-nxdn-ysf-m17-dstar-monitor-scan-cw)
          fi
          python3 tools/build_mode_presets.py --tree "$TREE" --out dist --version "$VERSION" \
            --git "$GITHUB_SHA" --cross "$GITHUB_WORKSPACE/toolchain/bin/csky-elf-" --jobs 4 "${MODE_ARGS[@]}"
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfoundry-dm32-${{ steps.package.outputs.version }}
          path: dist/*

      - name: Publish the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          TITLE: ${{ github.event.inputs.title }}
        run: |
          set -eu
          TAG="v$VERSION"
          {
            git log -1 --format='%B' "$GITHUB_SHA"
            echo
            echo "---"
            echo "Imagen sin códec AMBE para el Baofeng DM-32UV, compilada desde ${GITHUB_SHA::8}. El web flasher la instala sola"
            echo "en unos minutos: https://donttellmeimcute.github.io/dm32-web-cps-flasher/ (toma el códec de tu propia radio)."
            echo
            echo "El firmware incluye TX de banco de 220 a 230 MHz mediante PTT manual en FM estrecha."
            echo "Para medir la salida RF, conecta una carga ficticia de 50 Ω."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "${TITLE:-NXDN-P25-DM32 $VERSION}" --notes-file notes.md
          fi

      # Optional: with a token that may run workflows in dm32-web-cps-flasher (secret FLASHER_TOKEN), the flasher
      # updates right away; without it, its Sync firmware workflow finds the release on its next scheduled check
      - name: Tell the web flasher
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.FLASHER_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run sync-firmware.yml --repo donttellmeimcute/dm32-web-cps-flasher
          else
            echo "No FLASHER_TOKEN: the flasher picks the release up on its next scheduled check"
          fi
